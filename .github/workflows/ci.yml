name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Base de datos de los e2e de la API. Sin contraseña: solo vive en el runner y escucha en su máquina.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: franca
          POSTGRES_DB: franca
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U franca -d franca"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint, typecheck, build y test corren sin DATABASE_URL: demuestran en cada PR que `pnpm check` no la necesita.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Chromium de los E2E de la web: cada versión de @playwright/test (fijada en el lockfile) fija su navegador.
      - run: pnpm --filter @franca/web exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://franca@127.0.0.1:5432/franca
      - run: pnpm validate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-resultados
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
