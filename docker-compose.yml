# Postgres local para la API (`apps/api`). Solo escucha en loopback y no tiene contraseña: es una base de
# desarrollo sin datos reales (mismo modelo de amenaza que la API, que solo escucha en la máquina local).
# Arrancar: `docker compose up -d`. Parar: `docker compose stop`. Borrar también los datos: `docker compose down -v`.
name: franca

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: franca
      POSTGRES_DB: franca
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${FRANCA_POSTGRES_PORT:-5432}:5432"
    # Desde la 18 la imagen guarda los datos en /var/lib/postgresql/<versión>/docker y espera el volumen aquí.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U franca -d franca"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
